# Copier vers ~/.config/ambient-light/config.toml (aucun secret ici).
# Seules les clés à modifier sont nécessaires ; les autres gardent leur défaut.

[light]
controller = "fake"        # "fake" = simulation, "hueble" = vraie ampoule
address = ""               # adresse BLE (voir `ambient-light scan`) ; vide = auto
neutral_color = "off"      # "off" ou "#RRGGBB"
brightness = 254           # 1..254
on_disconnect = "retry"    # retry | ignore

[sources]
claude = true
teams = false              # voir README (Microsoft Graph)

[events.task_completed]
color = "#00FF00"
priority = 40
duration = 3               # secondes ; 0 = persistant

[teams]
client_id = ""             # application Entra (client public) — voir README
tenant = "organizations"
poll_presence = 15
poll_chats = 20
messages = true
meeting_counts_as_call = true
